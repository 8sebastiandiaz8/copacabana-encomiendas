<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-label="Alcance de la entrega frente al trabajo pendiente">
<rect width="1000" height="490" fill="#ffffff"/>
<text x="40" y="54" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650" letter-spacing="0" fill="#102c50">Alcance de la entrega</text>
<text x="40" y="80" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0" fill="#5c728a">Qué queda resuelto en esta versión y qué se deja para después.</text>
<path d="M40 102 L960 102" stroke="#e6eef7" stroke-width="1.4"/>
<rect x="40" y="126" width="566" height="250" rx="14" fill="#ffffff" stroke="#cfdcea" stroke-width="1.4"/>
<text x="70" y="166" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.3" fill="#163f75">Incluido en la entrega</text>
<circle cx="78" cy="206" r="11" fill="#eef7f2"/><path d="M73.4 206 L77 209.8 L83 202.4" fill="none" stroke="#21745b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="207" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="650" letter-spacing="0" fill="#102c50">Registro de encomiendas con guía única</text>
<text x="100" y="224" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#5c728a">validación, tarifa y comprobante</text>
<circle cx="78" cy="249" r="11" fill="#eef7f2"/><path d="M73.4 249 L77 252.8 L83 245.4" fill="none" stroke="#21745b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="250" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="650" letter-spacing="0" fill="#102c50">Despacho, manifiesto y hoja de ruta</text>
<text x="100" y="267" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#5c728a">asignación de flota y viaje</text>
<circle cx="78" cy="292" r="11" fill="#eef7f2"/><path d="M73.4 292 L77 295.8 L83 288.4" fill="none" stroke="#21745b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="293" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="650" letter-spacing="0" fill="#102c50">Seguimiento GPS y consulta del cliente</text>
<text x="100" y="310" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#5c728a">estado y ubicación en tiempo real</text>
<circle cx="78" cy="335" r="11" fill="#eef7f2"/><path d="M73.4 335 L77 338.8 L83 331.4" fill="none" stroke="#21745b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="336" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="650" letter-spacing="0" fill="#102c50">Incidencias, auditoría y entrega final</text>
<text x="100" y="353" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#5c728a">histórico inmutable y cierre</text>
<rect x="634" y="126" width="326" height="250" rx="14" fill="#fbfcfe" stroke="#cfdcea" stroke-width="1.4"/>
<text x="664" y="166" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="0" fill="#5c728a">Fuera de alcance</text>
<circle cx="672" cy="210" r="11" fill="#fbfcfe" stroke="#cfdcea"/><path d="M668 210 h8" stroke="#5c728a" stroke-width="2" stroke-linecap="round"/>
<text x="694" y="211" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#4c6078">App móvil nativa</text>
<text x="694" y="228" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#5c728a">la web funciona en el teléfono</text>
<circle cx="672" cy="262" r="11" fill="#fbfcfe" stroke="#cfdcea"/><path d="M668 262 h8" stroke="#5c728a" stroke-width="2" stroke-linecap="round"/>
<text x="694" y="263" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#4c6078">Facturación electrónica</text>
<text x="694" y="280" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#5c728a">solo comprobante interno</text>
<circle cx="672" cy="314" r="11" fill="#fbfcfe" stroke="#cfdcea"/><path d="M668 314 h8" stroke="#5c728a" stroke-width="2" stroke-linecap="round"/>
<text x="694" y="315" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#4c6078">Transportistas externos</text>
<text x="694" y="332" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#5c728a">flota propia del estudio</text>
<rect x="40" y="396" width="920" height="58" rx="12" fill="#fff4ec" stroke="#f6d3bd" stroke-width="1.4"/>
<text x="64" y="431" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" letter-spacing="0" fill="#8a4a22">La demostración cubre el flujo completo con datos de prueba: registrar, despachar, seguir y entregar.</text>
</svg>
