<rect x="58" y="60" width="196" height="86" rx="12" fill="#f5f9fe" stroke="#cfdcea" stroke-width="1.4"/><text x="156.0" y="88.75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="650" letter-spacing="0" fill="#102c50">Cliente</text><text x="156.0" y="107.25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="500" letter-spacing="0" fill="#102c50">registra y consulta</text><text x="156.0" y="125.75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="500" letter-spacing="0" fill="#102c50">solo sus envíos</text><rect x="58" y="292" width="196" height="86" rx="12" fill="#f5f9fe" stroke="#cfdcea" stroke-width="1.4"/><text x="156.0" y="320.75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="650" letter-spacing="0" fill="#102c50">Operador</text><text x="156.0" y="339.25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="500" letter-spacing="0" fill="#102c50">opera los envíos</text><text x="156.0" y="357.75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="500" letter-spacing="0" fill="#102c50">que tiene asignados</text><rect x="646" y="60" width="196" height="86" rx="12" fill="#f5f9fe" stroke="#cfdcea" stroke-width="1.4"/><text x="744.0" y="88.75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="650" letter-spacing="0" fill="#102c50">Gerencia</text><text x="744.0" y="107.25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="500" letter-spacing="0" fill="#102c50">catálogos, auditoría</text><text x="744.0" y="125.75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="500" letter-spacing="0" fill="#102c50">y dispositivos GPS</text><rect x="646" y="292" width="196" height="86" rx="12" fill="#f5f9fe" stroke="#cfdcea" stroke-width="1.4"/><text x="744.0" y="320.75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="650" letter-spacing="0" fill="#102c50">Administrador</text><text x="744.0" y="339.25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="500" letter-spacing="0" fill="#102c50">cuentas y roles</text><text x="744.0" y="357.75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="500" letter-spacing="0" fill="#102c50">sin borrar al último</text><rect x="342" y="172" width="216" height="96" rx="12" fill="#163f75" stroke="#163f75" stroke-width="1.4"/><text x="450.0" y="214.76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" letter-spacing="0" fill="#ffffff">Sistema</text><text x="450.0" y="234.76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="0" fill="#ffffff">de encomiendas</text><path d="M256 104 L342 190" fill="none" stroke="#9fb3c8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw)"/><path d="M256 334 L342 250" fill="none" stroke="#9fb3c8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw)"/><path d="M644 104 L558 190" fill="none" stroke="#9fb3c8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw)"/><path d="M644 334 L558 250" fill="none" stroke="#9fb3c8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw)"/><text x="450" y="418" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#8fa3b8">El servidor toma el rol de la base de datos en cada petición</text>
