<text x="40" y="80" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0" fill="#5c728a">Cuatro roles con límites explícitos sobre envíos, catálogos y cuentas</text>
