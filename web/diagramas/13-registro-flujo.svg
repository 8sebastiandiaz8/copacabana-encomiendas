xt-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="650" letter-spacing="0" fill="#102c50">Generar código</text><text x="725.0" y="206.92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="0" fill="#102c50">y tarifa</text><path d="M816 193 L848 193" fill="none" stroke="#9fb3c8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw)"/><rect x="850" y="152" width="110" height="82" rx="12" fill="#f5f9fe" stroke="#cfdcea" stroke-width="1.4"/><text x="905.0" y="188.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="650" letter-spacing="0" fill="#102c50">Guardar</text><text x="905.0" y="206.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="500" letter-spacing="0" fill="#102c50">y auditar</text><path d="M520 246 L520 300" fill="none" stroke="#9fb3c8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw)"/><text x="534" y="280" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0" fill="#ed7138">no</text><rect x="410" y="302" width="220" height="74" rx="12" fill="#fff4ec" stroke="#f0c6a9" stroke-width="1.4"/><text x="520.0" y="334.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="650" letter-spacing="0" fill="#102c50">Mostrar errores</text><text x="520.0" y="352.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="500" letter-spacing="0" fill="#102c50">para corrección</text><path d="M410 339 L332 339 L332 238" fill="none" stroke="#9fb3c8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw)"/><text x="940" y="380" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#8fa3b8">Sin registros parciales</text>
