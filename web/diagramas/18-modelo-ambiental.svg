<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 800" width="1360" height="800" role="img" aria-label="Modelo ambiental del sistema de encomiendas: entidades externas y flujos">
<defs><style class="style-fonts">@font-face { font-family: Excalifont; src: url(data:font/woff2;base64,); }</style>
<filter id="soft" x="-15%" y="-20%" width="130%" height="150%">
  <feDropShadow dx="0" dy="3" stdDeviation="4.5" flood-color="#102c50" flood-opacity="0.10"/>
</filter>
<marker id="arw-4a6fa5" viewBox="0 0 10 10" refX="7.6" refY="5" markerWidth="7.4" markerHeight="7.4" orient="auto-start-reverse"><path d="M2 2.6 L9 5 L2 7.4" fill="none" stroke="#4a6fa5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arw-cf7842" viewBox="0 0 10 10" refX="7.6" refY="5" markerWidth="7.4" markerHeight="7.4" orient="auto-start-reverse"><path d="M2 2.6 L9 5 L2 7.4" fill="none" stroke="#cf7842" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arw-3f8a6f" viewBox="0 0 10 10" refX="7.6" refY="5" markerWidth="7.4" markerHeight="7.4" orient="auto-start-reverse"><path d="M2 2.6 L9 5 L2 7.4" fill="none" stroke="#3f8a6f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arw-7b5fb5" viewBox="0 0 10 10" refX="7.6" refY="5" markerWidth="7.4" markerHeight="7.4" orient="auto-start-reverse"><path d="M2 2.6 L9 5 L2 7.4" fill="none" stroke="#7b5fb5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1360" height="800" fill="#ffffff"/>

<!-- sistema -->
<ellipse cx="690" cy="395" rx="252" ry="112" fill="#ffffff" stroke="#102c50" stroke-width="2.8" filter="url(#soft)"/>
<text x="690" y="377" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="25" fill="#102c50">Sistema de Control y Seguimiento</text>
<text x="690" y="407" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="25" fill="#102c50">de Encomiendas</text>
<text x="690" y="441" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="18" fill="#4c6078">(Copacabana Encomiendas)</text>

<!-- entidades -->
<rect x="24" y="52" width="330" height="106" rx="17" fill="#eef4fd" stroke="#4a6fa5" stroke-width="2.4" stroke-linejoin="round" filter="url(#soft)"/><text x="189.0" y="114.0" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="27" fill="#102c50">Administrador</text>
<rect x="872" y="14" width="330" height="106" rx="17" fill="#fff4ec" stroke="#cf7842" stroke-width="2.4" stroke-linejoin="round" filter="url(#soft)"/><text x="1037.0" y="76.0" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="27" fill="#102c50">Cliente</text>
<rect x="180" y="672" width="360" height="106" rx="17" fill="#eef8f2" stroke="#3f8a6f" stroke-width="2.4" stroke-linejoin="round" filter="url(#soft)"/><text x="360.0" y="723.0" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="25" fill="#102c50">Chófer / Transporte</text><text x="360.0" y="753.0" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="20" fill="#22303f">(Módulo GPS)</text>
<rect x="1000" y="672" width="360" height="106" rx="17" fill="#f5f1fd" stroke="#7b5fb5" stroke-width="2.4" stroke-linejoin="round" filter="url(#soft)"/><text x="1180.0" y="734.0" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="27" fill="#102c50">Operador de sucursal</text>

<!-- administrador: configuración entra, reportes salen -->
<path d="M300 158 C 380 245, 448 305, 472 340" fill="none" stroke="#4a6fa5" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arw-4a6fa5)"/>
<path d="M446 364 C 330 360, 240 300, 188 158" fill="none" stroke="#4a6fa5" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arw-4a6fa5)"/>
<text x="495" y="200" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="21" fill="#22303f" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">Config. sucursales /</text><text x="495" y="227" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="21" fill="#22303f" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">transporte / rutas</text>
<text x="180" y="330" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="21" fill="#22303f" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">Reportes auditoría</text>

<!-- cliente: datos entran, guía sale -->
<path d="M1060 120 C 1020 245, 980 305, 908 340" fill="none" stroke="#cf7842" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arw-cf7842)"/>
<path d="M934 364 C 1050 360, 1130 300, 1172 120" fill="none" stroke="#cf7842" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arw-cf7842)"/>
<text x="925" y="205" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="21" fill="#22303f" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">Datos envío /</text><text x="925" y="232" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="21" fill="#22303f" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">Consulta guía</text>
<text x="1215" y="330" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="21" fill="#22303f" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">Guía de envío /</text><text x="1215" y="357" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="21" fill="#22303f" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">Estado GPS</text>

<!-- chófer: reporte entra, hoja de ruta sale -->
<path d="M455 672 C 520 615, 575 550, 602 499" fill="none" stroke="#3f8a6f" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arw-3f8a6f)"/>
<path d="M532 483 C 470 560, 400 620, 335 672" fill="none" stroke="#3f8a6f" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arw-3f8a6f)"/>
<text x="640" y="600" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="21" fill="#22303f" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">Reporte ruta /</text><text x="640" y="627" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="21" fill="#22303f" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">Incidencias</text>
<text x="340" y="520" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="21" fill="#22303f" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">Hoja de ruta asignada</text>

<!-- operador: registro entra, manifiesto sale -->
<path d="M1080 672 C 1030 610, 880 550, 778 499" fill="none" stroke="#7b5fb5" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arw-7b5fb5)"/>
<path d="M848 483 C 940 560, 1120 620, 1230 672" fill="none" stroke="#7b5fb5" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arw-7b5fb5)"/>
<text x="1160" y="565" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="21" fill="#22303f" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">Manifiesto carga /</text><text x="1160" y="592" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="21" fill="#22303f" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">Alertas</text>
<text x="880" y="625" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="21" fill="#22303f" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">Registro guía /</text><text x="880" y="652" text-anchor="middle" font-family="Excalifont, Segoe UI, sans-serif" font-size="21" fill="#22303f" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">Entrega</text>
</svg>
